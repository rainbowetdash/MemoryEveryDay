<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f9ff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="stylesheet" href="./styles.css?v=24" />
    <link rel="stylesheet" href="./calendar-month.css?v=24" />
    <style>
      html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
      body { min-height: 100dvh; }
      #day-screen { display: flex; flex-direction: column; height: 100%; min-height: 0; overflow: hidden; }
      #day-screen.is-hidden { display: none; }
      .day-header, .day-summary { flex: 0 0 auto; }
      .timeline { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 0 8px 10px 0; scrollbar-color: #aac7dc transparent; scrollbar-width: thin; }
      .timeline::-webkit-scrollbar { width: 4px; }
      .timeline::-webkit-scrollbar-thumb { background: #aac7dc; border-radius: 4px; }
      @media (min-width: 541px) { .app-shell { height: calc(100dvh - 44px); max-height: calc(100dvh - 44px); min-height: 640px; } }
      @media (max-width: 540px) { .app-shell { height: 100dvh; max-height: 100dvh; min-height: 0; } }
      .day-date-trigger { display: inline-grid; gap: 3px; border: 0; background: transparent; color: #18324f; padding: 0; text-align: left; cursor: pointer; }
      .day-date-trigger:hover .day-title-line, .day-date-trigger:focus-visible .day-title-line { color: #1769aa; }
      .day-date-trigger:focus-visible { outline: 2px solid #2484c5; outline-offset: 4px; border-radius: 5px; }
      #day-year { color: #6686a2; font-size: 13px; font-weight: 650; }
      .day-title-line { display: flex; align-items: center; gap: 7px; transition: color .16s; }
      #day-title { font-size: 28px; line-height: 1.08; letter-spacing: -.5px; }
      .day-title-chevron { color: #5485ab; font-size: 18px; transform: translateY(2px); }
      .day-date-dialog { width: min(460px, calc(100% - 32px)); max-height: min(680px, calc(100dvh - 32px)); margin: auto; border: 0; border-radius: 16px; background: #fafdff; box-shadow: 0 22px 70px #163b5d38; }
      .day-date-dialog[open] { animation: day-picker-open .22s cubic-bezier(.2,.85,.28,1) both; }
      .day-date-dialog::backdrop { background: #0c345966; backdrop-filter: blur(2px); }
      .day-picker-panel { padding: 24px; }
      .day-picker-close { flex: 0 0 auto; }
      .day-picker-heading { margin: 7px 0 18px; }
      .day-picker-year { display: inline-flex; align-items: center; gap: 5px; border: 0; background: transparent; color: #547895; padding: 0; font-size: 15px; font-weight: 750; cursor: pointer; }
      .day-picker-year:hover { color: #1769aa; }
      .day-picker-date { display: block; margin-top: 4px; font-size: 30px; letter-spacing: -.6px; color: #18324f; }
      .day-year-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; max-height: 168px; margin: -4px 0 16px; overflow-y: auto; overscroll-behavior: contain; padding: 7px; border: 1px solid #cfe0ee; border-radius: 10px; background: #f4faff; scrollbar-width: thin; }
      .day-year-option { border: 0; border-radius: 7px; background: transparent; color: #42627f; padding: 9px 4px; font-weight: 700; cursor: pointer; }
      .day-year-option:hover, .day-year-option.is-selected { background: #dff1ff; color: #1769aa; }
      .day-picker-month-row { display: grid; grid-template-columns: 38px 1fr 38px; align-items: center; margin-bottom: 13px; text-align: center; }
      .day-picker-month-row strong { font-size: 16px; }
      .day-picker-nav { display: grid; place-items: center; width: 34px; height: 34px; border: 0; border-radius: 50%; background: #eaf5ff; color: #24679d; font-size: 25px; line-height: 1; cursor: pointer; }
      .day-picker-nav:hover { background: #dbefff; }
      .day-picker-weekdays, .day-picker-grid { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; }
      .day-picker-weekdays { margin-bottom: 5px; color: #8ba5bf; font-size: 11px; }
      .day-picker-grid { gap: 3px; }
      .day-picker-day { aspect-ratio: 1; border: 0; border-radius: 50%; background: transparent; color: #345b7e; font-size: 13px; font-weight: 650; cursor: pointer; }
      .day-picker-day:hover { background: #e6f4ff; color: #1769aa; }
      .day-picker-day.is-other { color: #bdcbd7; }
      .day-picker-day.is-today:not(.is-selected) { color: #0879c9; font-weight: 850; }
      .day-picker-day.is-selected { background: #1769aa; color: #fff; box-shadow: 0 3px 9px #1769aa40; }
      .calendar-month-trigger { min-width: 112px; border: 0; background: transparent; color: #18324f; padding: 4px 6px; border-radius: 7px; font-size: 20px; font-weight: 700; letter-spacing: 0; cursor: pointer; }
      .calendar-month-trigger:hover { background: #eaf5ff; color: #1769aa; }
      .calendar-month-trigger:focus-visible { outline: 2px solid #2484c5; outline-offset: 2px; }
      .calendar-year-dialog { width: min(360px, calc(100% - 32px)); margin: auto; border: 0; border-radius: 16px; background: #fafdff; box-shadow: 0 22px 70px #163b5d38; }
      .calendar-year-dialog[open] { animation: day-picker-open .22s cubic-bezier(.2,.85,.28,1) both; }
      .calendar-year-dialog::backdrop { background: #0c345966; backdrop-filter: blur(2px); }
      .calendar-year-panel { padding: 24px; }
      .calendar-year-list { max-height: min(420px, calc(100dvh - 170px)); margin: 0; }
      @keyframes day-picker-open { from { opacity: 0; transform: scale(.86) translateY(16px); } to { opacity: 1; transform: scale(1) translateY(0); } }
      @media (max-width: 420px) { .day-picker-panel { padding: 21px 18px; } .day-picker-date { font-size: 28px; } }
    </style>
    <title>每日备忘</title>
  </head>
  <body>
    <main class="app-shell">
      <section class="screen" id="calendar-screen" aria-label="日历">
        <header class="topbar">
          <button class="today-button" id="today-button">今天</button>
          <div class="month-switcher">
            <button class="icon-button" id="previous-month" aria-label="上个月">‹</button>
            <button type="button" id="calendar-month-trigger" class="calendar-month-trigger" aria-haspopup="dialog" aria-label="选择年份"></button>
            <button class="icon-button" id="next-month" aria-label="下个月">›</button>
          </div>
          <div class="topbar-actions">
            <button type="button" id="account-button" class="account-button" aria-label="登录并同步日程"><span class="account-icon">⌁</span><span id="account-button-label">登录同步</span></button>
            <div class="calendar-zoom-controls" aria-label="日历显示大小">
              <button type="button" id="calendar-zoom-out" class="zoom-button" aria-label="缩小月历" title="缩小月历">−</button>
              <button type="button" id="calendar-zoom-in" class="zoom-button" aria-label="放大月历" title="放大月历">＋</button>
            </div>
          </div>
        </header>
        <section class="up-next">
          <div class="section-heading"><span id="schedule-count"></span></div>
          <div id="calendar-agenda" class="agenda-list"></div>
        </section>
        <div class="calendar-scroll" id="calendar-scroll"><div class="calendar-canvas"><div class="weekdays" aria-hidden="true"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div class="calendar-grid" id="calendar-grid"></div></div></div>
      </section>

      <section class="screen is-hidden" id="day-screen" aria-label="日程">
        <header class="day-header">
          <div>
            <button type="button" class="day-date-trigger" id="day-date-trigger" aria-haspopup="dialog" aria-label="选择日期">
              <span id="day-year"></span>
              <span class="day-title-line"><strong id="day-title"></strong><span class="day-title-chevron" aria-hidden="true">⌄</span></span>
            </button>
            <p id="day-weekday"></p>
          </div>
          <button class="today-button" id="jump-today">回到今天</button>
        </header>
        <div class="day-summary" id="day-summary"></div>
        <div class="timeline" id="timeline"></div>
      </section>

      <nav class="tabbar" aria-label="主导航">
        <button class="tab is-active" data-screen="calendar-screen"><span class="tab-icon">▦</span><span>日历</span></button>
        <button class="tab" data-screen="day-screen"><span class="tab-icon">☷</span><span>日程</span></button>
      </nav>
      <button class="add-button" id="add-button" aria-label="添加日程">＋</button>
    </main>

    <dialog id="event-dialog">
      <form method="dialog" id="event-form" novalidate>
        <div class="modal-header"><div><p class="modal-eyebrow" id="event-dialog-eyebrow">新的安排</p><h2 id="event-dialog-title">添加日程</h2></div><button type="button" id="close-event-dialog" class="close-button" aria-label="关闭">×</button></div>
        <label>内容<input id="event-title" name="title" required maxlength="60" placeholder="例如：和朋友喝咖啡" /></label>
        <input id="event-date" name="date" type="hidden" />
        <input id="event-time" name="time" type="hidden" value="09:00" />
        <input id="event-end-time" name="endTime" type="hidden" />
        <input id="event-time-mode" name="timeMode" type="hidden" value="reminder" />
        <div class="form-label">时间安排</div>
        <button type="button" id="schedule-editor-trigger" class="schedule-editor-trigger" aria-label="更改日期和时间" aria-expanded="false"><span class="schedule-editor-icon">◷</span><span><strong id="schedule-editor-title">7月22日</strong><small id="schedule-editor-subtitle">09:00 提醒</small></span><span class="chevron">›</span></button>
        <section id="schedule-editor" class="schedule-editor is-hidden" aria-label="更改日期和时间">
          <header class="schedule-editor-header"><button type="button" id="close-schedule-editor" class="back-button" aria-label="返回">‹</button><div><p>时间安排</p><strong>选择日期和时间</strong></div></header>
          <div class="mini-calendar-header"><button type="button" class="mini-nav" id="picker-previous-month" aria-label="上个月">‹</button><strong id="picker-month-label"></strong><button type="button" class="mini-nav" id="picker-next-month" aria-label="下个月">›</button></div>
          <div class="mini-weekdays" aria-hidden="true"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
          <div class="mini-calendar-grid" id="picker-calendar-grid"></div>
          <div class="time-mode-row"><div><strong>设置时间段</strong><small>关闭时仅作为提醒时间</small></div><button type="button" id="time-mode-toggle" class="mode-switch" role="switch" aria-checked="false"><span></span></button></div>
          <div class="time-inputs"><label>提醒时间<input id="event-time-input" inputmode="numeric" autocomplete="off" maxlength="5" placeholder="09:00" value="09:00" /></label><label id="end-time-field" class="is-hidden">结束时间（可填 24:00）<input id="event-end-time-input" inputmode="numeric" autocomplete="off" maxlength="5" placeholder="24:00" value="10:00" /></label></div>
          <button type="button" id="apply-schedule-editor" class="apply-schedule-button">完成时间安排</button>
        </section>
        <div class="form-label">颜色</div>
        <input id="event-color" name="color" type="hidden" value="blue" />
        <div class="color-picker" id="event-color-picker" role="radiogroup" aria-label="日程颜色">
          <button type="button" class="color-choice blue" data-event-color="blue" role="radio" aria-checked="true"><span class="color-swatch"></span><span>海雾蓝</span></button>
          <button type="button" class="color-choice navy" data-event-color="navy" role="radio" aria-checked="false"><span class="color-swatch"></span><span>深海蓝</span></button>
          <button type="button" class="color-choice cyan" data-event-color="cyan" role="radio" aria-checked="false"><span class="color-swatch"></span><span>晴空蓝</span></button>
          <button type="button" class="color-choice mint" data-event-color="mint" role="radio" aria-checked="false"><span class="color-swatch"></span><span>薄荷绿</span></button>
          <button type="button" class="color-choice purple" data-event-color="purple" role="radio" aria-checked="false"><span class="color-swatch"></span><span>薰衣草紫</span></button>
          <button type="button" class="color-choice pink" data-event-color="pink" role="radio" aria-checked="false"><span class="color-swatch"></span><span>樱花粉</span></button>
          <button type="button" class="color-choice coral" data-event-color="coral" role="radio" aria-checked="false"><span class="color-swatch"></span><span>珊瑚橘</span></button>
          <button type="button" class="color-choice yellow" data-event-color="yellow" role="radio" aria-checked="false"><span class="color-swatch"></span><span>向日葵黄</span></button>
          <button type="button" class="color-choice green" data-event-color="green" role="radio" aria-checked="false"><span class="color-swatch"></span><span>森林绿</span></button>
        </div>
        <p class="form-error" id="form-error" role="alert"></p>
        <div class="dialog-actions"><button type="button" id="delete-event-button" class="delete-button is-hidden">删除日程</button><button class="save-button" id="save-event-button" value="default">保存日程</button></div>
      </form>
    </dialog>
    <dialog id="day-date-dialog" class="day-date-dialog" aria-labelledby="day-picker-date-label">
      <section class="day-picker-panel">
        <header class="modal-header"><div><p class="modal-eyebrow">选择日期</p><h2>日程</h2></div><button type="button" id="close-day-date-dialog" class="close-button day-picker-close" aria-label="关闭日期选择">×</button></header>
        <div class="day-picker-heading">
          <button type="button" id="day-picker-year" class="day-picker-year" aria-expanded="false"><span id="day-picker-year-label"></span></button>
          <strong id="day-picker-date-label" class="day-picker-date"></strong>
        </div>
        <div id="day-year-list" class="day-year-list is-hidden" aria-label="选择年份"></div>
        <div class="day-picker-month-row"><button type="button" id="day-picker-previous-month" class="day-picker-nav" aria-label="上个月">‹</button><strong id="day-picker-month-label"></strong><button type="button" id="day-picker-next-month" class="day-picker-nav" aria-label="下个月">›</button></div>
        <div class="day-picker-weekdays" aria-hidden="true"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
        <div id="day-picker-grid" class="day-picker-grid" aria-label="选择日期"></div>
      </section>
    </dialog>
    <dialog id="calendar-year-dialog" class="calendar-year-dialog" aria-labelledby="calendar-year-dialog-title">
      <section class="calendar-year-panel">
        <header class="modal-header"><div><p class="modal-eyebrow">选择年份</p><h2 id="calendar-year-dialog-title">日历</h2></div><button type="button" id="close-calendar-year-dialog" class="close-button" aria-label="关闭年份选择">×</button></header>
        <div id="calendar-year-list" class="day-year-list calendar-year-list" aria-label="选择年份"></div>
      </section>
    </dialog>
    <dialog id="auth-dialog" aria-labelledby="auth-dialog-title">
      <form id="auth-form" novalidate>
        <div class="modal-header"><div><p class="modal-eyebrow" id="auth-dialog-eyebrow">跨设备保存</p><h2 id="auth-dialog-title">登录同步</h2></div><button type="button" id="close-auth-dialog" class="close-button" aria-label="关闭">×</button></div>
        <section id="signed-out-panel">
          <p class="auth-copy" id="auth-mode-copy">使用已注册的邮箱和密码登录，同一账号在手机和电脑上会显示相同的日程。</p>
          <label id="auth-username-field" class="is-hidden">用户名（必填，最多 10 字）<input id="auth-username" type="text" autocomplete="nickname" maxlength="10" placeholder="例如：小满" /></label>
          <label>邮箱<input id="auth-email" type="email" inputmode="email" autocomplete="email" placeholder="name@example.com" required /></label>
          <label>密码<input id="auth-password" type="password" autocomplete="current-password" minlength="6" placeholder="至少 6 位" required /></label>
          <label id="auth-password-confirm-field" class="is-hidden">确认密码<input id="auth-password-confirm" type="password" autocomplete="new-password" minlength="6" placeholder="再次输入密码" /></label>
          <p class="auth-message" id="auth-message" role="status"></p>
          <button class="save-button" id="auth-primary-button" type="submit">登录</button>
          <button class="auth-link-button" id="auth-mode-switch" type="button">第一次使用？注册账号</button>
          <p class="auth-note" id="auth-note">密码至少需要 6 位。日程仅属于登录的这个邮箱。</p>
        </section>
        <section id="signed-in-panel" class="is-hidden">
          <div class="account-summary"><span class="account-summary-icon">✓</span><div><strong id="account-email"></strong><small id="sync-status">正在准备同步…</small></div></div>
          <p class="auth-copy">这个账号的日程会保存到云端。你可以在另一台设备登录同一个邮箱继续查看和编辑。</p>
          <p class="auth-message" id="signed-in-message" role="status"></p>
          <button class="sync-now-button" id="sync-now-button" type="button">立即同步</button>
          <button class="sign-out-button" id="sign-out-button" type="button">退出登录</button>
        </section>
      </form>
    </dialog>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="./app.js?v=24"></script>
  </body>
</html>
