<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f9ff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="stylesheet" href="./styles.css?v=12" />
    <link rel="stylesheet" href="./calendar-month.css?v=12" />
    <title>每日备忘</title>
  </head>
  <body>
    <main class="app-shell">
      <section class="screen" id="calendar-screen" aria-label="日历">
        <header class="topbar">
          <button class="today-button" id="today-button">今天</button>
          <div class="month-switcher">
            <button class="icon-button" id="previous-month" aria-label="上个月">‹</button>
            <h1 id="month-label"></h1>
            <button class="icon-button" id="next-month" aria-label="下个月">›</button>
          </div>
          <div class="topbar-actions">
            <button type="button" id="account-button" class="account-button" aria-label="登录并同步日程"><span class="account-icon">⌁</span><span id="account-button-label">登录同步</span></button>
            <div class="calendar-zoom-controls" aria-label="日历显示大小">
              <button type="button" id="calendar-zoom-out" class="zoom-button" aria-label="缩小月历" title="缩小月历">−</button>
              <button type="button" id="calendar-zoom-in" class="zoom-button" aria-label="放大月历" title="放大月历">＋</button>
            </div>
          </div>
        </header>
        <div class="calendar-scroll" id="calendar-scroll"><div class="calendar-canvas"><div class="weekdays" aria-hidden="true"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div class="calendar-grid" id="calendar-grid"></div></div></div>
        <section class="up-next">
          <div class="section-heading"><span id="selected-date-label">今天</span><span id="schedule-count"></span></div>
          <div id="calendar-agenda" class="agenda-list"></div>
        </section>
      </section>

      <section class="screen is-hidden" id="day-screen" aria-label="日程">
        <header class="day-header">
          <div>
            <p id="day-weekday"></p>
            <h1 id="day-title"></h1>
          </div>
          <button class="today-button" id="jump-today">回到今天</button>
        </header>
        <div class="day-summary" id="day-summary"></div>
        <div class="timeline" id="timeline"></div>
      </section>

      <nav class="tabbar" aria-label="主导航">
        <button class="tab is-active" data-screen="calendar-screen"><span class="tab-icon">▦</span><span>日历</span></button>
        <button class="tab" data-screen="day-screen"><span class="tab-icon">☷</span><span>日程</span></button>
      </nav>
      <button class="add-button" id="add-button" aria-label="添加日程">＋</button>
    </main>

    <dialog id="event-dialog">
      <form method="dialog" id="event-form" novalidate>
        <div class="modal-header"><div><p class="modal-eyebrow" id="event-dialog-eyebrow">新的安排</p><h2 id="event-dialog-title">添加日程</h2></div><button type="button" id="close-event-dialog" class="close-button" aria-label="关闭">×</button></div>
        <label>内容<input id="event-title" name="title" required maxlength="60" placeholder="例如：和朋友喝咖啡" /></label>
        <input id="event-date" name="date" type="hidden" />
        <input id="event-time" name="time" type="hidden" value="09:00" />
        <input id="event-end-time" name="endTime" type="hidden" />
        <input id="event-time-mode" name="timeMode" type="hidden" value="reminder" />
        <div class="form-label">时间安排</div>
        <button type="button" id="schedule-editor-trigger" class="schedule-editor-trigger" aria-label="更改日期和时间" aria-expanded="false"><span class="schedule-editor-icon">◷</span><span><strong id="schedule-editor-title">7月22日</strong><small id="schedule-editor-subtitle">09:00 提醒</small></span><span class="chevron">›</span></button>
        <section id="schedule-editor" class="schedule-editor is-hidden" aria-label="更改日期和时间">
          <header class="schedule-editor-header"><button type="button" id="close-schedule-editor" class="back-button" aria-label="返回">‹</button><div><p>时间安排</p><strong>选择日期和时间</strong></div></header>
          <div class="mini-calendar-header"><button type="button" class="mini-nav" id="picker-previous-month" aria-label="上个月">‹</button><strong id="picker-month-label"></strong><button type="button" class="mini-nav" id="picker-next-month" aria-label="下个月">›</button></div>
          <div class="mini-weekdays" aria-hidden="true"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
          <div class="mini-calendar-grid" id="picker-calendar-grid"></div>
          <div class="time-mode-row"><div><strong>设置时间段</strong><small>关闭时仅作为提醒时间</small></div><button type="button" id="time-mode-toggle" class="mode-switch" role="switch" aria-checked="false"><span></span></button></div>
          <div class="time-inputs"><label>提醒时间<input id="event-time-input" inputmode="numeric" autocomplete="off" maxlength="5" placeholder="09:00" value="09:00" /></label><label id="end-time-field" class="is-hidden">结束时间<input id="event-end-time-input" inputmode="numeric" autocomplete="off" maxlength="5" placeholder="10:00" value="10:00" /></label></div>
          <button type="button" id="apply-schedule-editor" class="apply-schedule-button">完成时间安排</button>
        </section>
        <div class="form-label">颜色</div>
        <input id="event-color" name="color" type="hidden" value="blue" />
        <div class="color-picker" id="event-color-picker">
          <button type="button" id="color-picker-trigger" class="color-picker-trigger" aria-haspopup="listbox" aria-expanded="false" aria-controls="color-picker-list"><span id="selected-color-swatch" class="color-swatch blue"></span><span id="selected-color-label">海雾蓝</span><span class="color-picker-chevron" aria-hidden="true">⌄</span></button>
          <div class="color-picker-list is-hidden" id="color-picker-list" role="listbox" aria-label="日程颜色">
            <button type="button" class="color-choice blue" data-event-color="blue" role="option" aria-selected="true"><span class="color-swatch"></span><span>海雾蓝</span><span class="color-choice-check" aria-hidden="true">✓</span></button>
            <button type="button" class="color-choice navy" data-event-color="navy" role="option" aria-selected="false"><span class="color-swatch"></span><span>深海蓝</span><span class="color-choice-check" aria-hidden="true">✓</span></button>
            <button type="button" class="color-choice cyan" data-event-color="cyan" role="option" aria-selected="false"><span class="color-swatch"></span><span>晴空蓝</span><span class="color-choice-check" aria-hidden="true">✓</span></button>
            <button type="button" class="color-choice mint" data-event-color="mint" role="option" aria-selected="false"><span class="color-swatch"></span><span>薄荷绿</span><span class="color-choice-check" aria-hidden="true">✓</span></button>
            <button type="button" class="color-choice purple" data-event-color="purple" role="option" aria-selected="false"><span class="color-swatch"></span><span>薰衣草紫</span><span class="color-choice-check" aria-hidden="true">✓</span></button>
            <button type="button" class="color-choice pink" data-event-color="pink" role="option" aria-selected="false"><span class="color-swatch"></span><span>樱花粉</span><span class="color-choice-check" aria-hidden="true">✓</span></button>
            <button type="button" class="color-choice coral" data-event-color="coral" role="option" aria-selected="false"><span class="color-swatch"></span><span>珊瑚橘</span><span class="color-choice-check" aria-hidden="true">✓</span></button>
            <button type="button" class="color-choice yellow" data-event-color="yellow" role="option" aria-selected="false"><span class="color-swatch"></span><span>向日葵黄</span><span class="color-choice-check" aria-hidden="true">✓</span></button>
            <button type="button" class="color-choice green" data-event-color="green" role="option" aria-selected="false"><span class="color-swatch"></span><span>森林绿</span><span class="color-choice-check" aria-hidden="true">✓</span></button>
          </div>
        </div>
        <p class="form-error" id="form-error" role="alert"></p>
        <div class="dialog-actions"><button type="button" id="delete-event-button" class="delete-button is-hidden">删除日程</button><button class="save-button" id="save-event-button" value="default">保存日程</button></div>
      </form>
    </dialog>
    <dialog id="auth-dialog" aria-labelledby="auth-dialog-title">
      <form id="auth-form" novalidate>
        <div class="modal-header"><div><p class="modal-eyebrow" id="auth-dialog-eyebrow">跨设备保存</p><h2 id="auth-dialog-title">登录同步</h2></div><button type="button" id="close-auth-dialog" class="close-button" aria-label="关闭">×</button></div>
        <section id="signed-out-panel">
          <p class="auth-copy" id="auth-mode-copy">使用已注册的邮箱和密码登录，同一账号在手机和电脑上会显示相同的日程。</p>
          <label>邮箱<input id="auth-email" type="email" inputmode="email" autocomplete="email" placeholder="name@example.com" required /></label>
          <label>密码<input id="auth-password" type="password" autocomplete="current-password" minlength="6" placeholder="至少 6 位" required /></label>
          <label id="auth-password-confirm-field" class="is-hidden">确认密码<input id="auth-password-confirm" type="password" autocomplete="new-password" minlength="6" placeholder="再次输入密码" /></label>
          <p class="auth-message" id="auth-message" role="status"></p>
          <button class="save-button" id="auth-primary-button" type="submit">登录</button>
          <button class="auth-link-button" id="auth-mode-switch" type="button">第一次使用？注册账号</button>
          <p class="auth-note">密码至少需要 6 位。日程仅属于登录的这个邮箱。</p>
        </section>
        <section id="signed-in-panel" class="is-hidden">
          <div class="account-summary"><span class="account-summary-icon">✓</span><div><strong id="account-email"></strong><small id="sync-status">正在准备同步…</small></div></div>
          <p class="auth-copy">这个账号的日程会保存到云端。你可以在另一台设备登录同一个邮箱继续查看和编辑。</p>
          <p class="auth-message" id="signed-in-message" role="status"></p>
          <button class="sync-now-button" id="sync-now-button" type="button">立即同步</button>
          <button class="sign-out-button" id="sign-out-button" type="button">退出登录</button>
        </section>
      </form>
    </dialog>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="./app.js?v=12"></script>
  </body>
</html>
