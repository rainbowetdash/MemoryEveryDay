name: MemoryEveryDay
options:
  bundleIdPrefix: com.memoryeveryday
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "6X7732M9V3"
targets:
  MemoryEveryDay:
    type: application
    platform: iOS
    sources:
      - path: MemoryEveryDay
      - path: ../../wecom-daily-memo-icon.png
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.memoryeveryday.app
        INFOPLIST_FILE: MemoryEveryDay/Info.plist
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - sdk: Speech.framework
