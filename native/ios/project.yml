name: MemoryEveryDay
options:
  bundleIdPrefix: com.memoryeveryday
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  MemoryEveryDay:
    type: application
    platform: iOS
    sources:
      - path: MemoryEveryDay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.memoryeveryday.app
        INFOPLIST_FILE: MemoryEveryDay/Info.plist
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
